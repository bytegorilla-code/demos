<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Store Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF9;--surface:#fff;--ink:#171018;--muted:#6A6270;--line:#EAE6EC;
  --accent:#7C3AED;--ok:#2F7D57;--shadow:0 1px 2px rgba(0,0,0,.04),0 14px 34px -14px rgba(0,0,0,.2);--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;border-radius:11px;padding:12px 20px;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(1px)}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn-lg{padding:15px 26px;font-size:16px}
.ribbon{position:fixed;top:14px;left:-42px;transform:rotate(-45deg);background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 52px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.bar{position:sticky;top:0;z-index:40;background:rgba(251,250,249,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600}
.mono{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:18px}
.cartbtn{position:relative}
.badge{position:absolute;top:-7px;right:-7px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.hero{padding:48px 0 26px;text-align:center}
.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.hero h1{font-size:clamp(36px,6.5vw,60px);line-height:1.03;margin:14px 0 12px;font-weight:600}
.hero p{font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:50ch;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:26px 0 4px}
.filters button{border:1px solid var(--line);background:var(--surface);font-family:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pimg{height:180px;display:grid;place-items:center;color:#fff;font-family:'Fraunces',serif;font-size:15px;opacity:.92}
.cbody{padding:14px 16px}
.pname{font-weight:600;font-size:15px}.pcat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pprice{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-top:6px}
.madeby{background:var(--ink);color:#fff;border-radius:22px;padding:34px;margin:34px 0 60px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.madeby h3{font-size:clamp(22px,3.4vw,28px);color:#fff;margin-bottom:6px}.madeby p{color:#C9C4CF;font-size:15px;max-width:44ch}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* product / cart overlay */
.overlay{position:fixed;inset:0;background:rgba(23,16,24,.55);z-index:70;display:none;overflow:auto}
.overlay.open{display:block}
.modal{max-width:720px;margin:40px auto;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.pd{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:620px){.pd{grid-template-columns:1fr}}
.pd .big{min-height:260px;display:grid;place-items:center;color:#fff;font-family:'Fraunces',serif;position:relative}
.pd .mclose{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);border:0;width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
.pd .det{padding:24px}
.pd .pcat{margin-bottom:6px}.pd h2{font-size:26px;margin-bottom:8px}
.pd .price{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:8px 0}
.pd .desc{font-size:14px;color:var(--muted);margin-bottom:16px}
.sizes{display:flex;gap:8px;margin-bottom:16px}
.sizes button{width:44px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600}
.sizes button.sel{border-color:var(--accent);background:var(--accent);color:#fff}
/* cart drawer */
.drawer{position:absolute;top:0;right:0;height:100%;width:100%;max-width:420px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:20px}
.dbody{flex:1;overflow:auto;padding:16px 20px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.dfoot{padding:18px 20px;border-top:1px solid var(--line);background:var(--surface)}
.trow{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}.trow.total{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:10px 0 14px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:var(--surface)}
.field input:focus{outline:none;border-color:var(--accent)}
.success{text-align:center;padding:40px 20px}
.check{width:62px;height:62px;border-radius:50%;background:var(--ok);margin:0 auto 14px;display:grid;place-items:center}
.check svg{width:30px;height:30px;stroke:#fff;stroke-width:3;fill:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="ribbon">DEMO</div>
<div class="bar"><div class="wrap">
  <div class="brand"><span class="mono" id="mono">S</span><span id="brandName">Your Store</span></div>
  <button class="btn btn-primary cartbtn" onclick="openCart()">Bag <span class="badge hidden" id="badge">0</span></button>
</div></div>

<header class="hero"><div class="wrap">
  <span class="eyebrow" id="typeLabel">Online Store</span>
  <h1 id="heroTitle">Your Store</h1>
  <p id="heroLede">Shop the collection online — free local pickup, fast delivery, easy checkout.</p>
  <div class="filters" id="filters"></div>
</div></header>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="madeby">
    <div><h3>Want to sell online like this?</h3><p id="madebyText">This store was built as a demo. Get a live shop, branded and ready to take orders.</p></div>
    <a id="ctaLink" class="btn btn-primary btn-lg" href="#" target="_blank" rel="noopener">Get yours →</a>
  </div>
</div></main>
<footer><div class="wrap"><span id="footName">Your Store</span><span>Demo built by <strong id="agencyFoot">Your Agency</strong></span></div></footer>

<div class="overlay" id="pOverlay" onclick="if(event.target===this)closeP()"><div class="modal" id="pModal"></div></div>
<div class="overlay" id="cOverlay" onclick="if(event.target===this)closeCart()"><div class="drawer">
  <div class="dhead"><h3 id="cartTitle">Your bag</h3><button class="btn btn-ghost" style="padding:7px 12px" onclick="closeCart()">✕</button></div>
  <div class="dbody" id="cartBody"></div><div class="dfoot" id="cartFoot"></div>
</div></div>

<script>
const COLORS=['#6D5AA6','#3E7C6B','#B0607C','#5E7C8B','#A9793E','#7A5C8E'];
const PRODUCTS=[
 {name:'Ceramic Mug',cat:'Home',price:16,sizes:null,desc:'Hand-glazed stoneware, 350ml.'},
 {name:'Linen Tote',cat:'Bags',price:24,sizes:null,desc:'Heavyweight natural linen, everyday carry.'},
 {name:'Wool Beanie',cat:'Apparel',price:22,sizes:['S','M','L'],desc:'Merino blend, soft and warm.'},
 {name:'Soy Candle',cat:'Home',price:19,sizes:null,desc:'Hand-poured, 40hr burn, cedar & sage.'},
 {name:'Graphic Tee',cat:'Apparel',price:28,sizes:['S','M','L','XL'],desc:'100% organic cotton, printed locally.'},
 {name:'Enamel Pin Set',cat:'Gifts',price:12,sizes:null,desc:'Set of three, hard enamel.'},
 {name:'Leather Card Holder',cat:'Bags',price:34,sizes:null,desc:'Full-grain leather, slim profile.'},
 {name:'Gift Box',cat:'Gifts',price:45,sizes:null,desc:'Curated bundle of best-sellers.'}
];
const P=new URLSearchParams(location.search);
const bizName=P.get('name')||"Your Store";
const accent=P.get('accent'); if(accent)document.documentElement.style.setProperty('--accent','#'+accent.replace('#',''));
const agency=P.get('agency')||"Your Agency"; const wa=P.get('wa');
mono.textContent=(bizName.trim()[0]||'S').toUpperCase();brandName.textContent=bizName;heroTitle.textContent=bizName;
footName.textContent=bizName;agencyFoot.textContent=agency;document.title=bizName+" · Shop online";
madebyText.textContent="This online store was built as a demo for "+bizName+". Get a live shop, branded and ready to take orders.";
ctaLink.href=wa?"https://wa.me/"+wa.replace(/\D/g,'')+"?text="+encodeURIComponent("Hi! I saw the store demo — I'd like an online shop for "+bizName+"."):"#";

let cart=[], filter='All';
const cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];
const filters=document.getElementById('filters');
cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c==='All'?'on':'';
  b.onclick=()=>{filter=c;[...filters.children].forEach(x=>x.classList.toggle('on',x===b));renderGrid();};
  filters.appendChild(b);});
const grid=document.getElementById('grid');
function color(p){return COLORS[PRODUCTS.indexOf(p)%COLORS.length];}
function renderGrid(){
  grid.innerHTML='';
  PRODUCTS.filter(p=>filter==='All'||p.cat===filter).forEach(p=>{
    const c=color(p);const el=document.createElement('div');el.className='card';
    el.innerHTML=`<div class="pimg" style="background:linear-gradient(135deg,${c},${c}bb)">${p.name}</div>
      <div class="cbody"><div class="pcat">${p.cat}</div><div class="pname">${p.name}</div><div class="pprice">£${p.price}</div></div>`;
    el.onclick=()=>openP(p);grid.appendChild(el);
  });
}
function openP(p){
  const c=color(p);let size=p.sizes?null:'One size';
  const m=document.getElementById('pModal');
  m.innerHTML=`<div class="pd">
    <div class="big" style="background:linear-gradient(135deg,${c},${c}aa)"><button class="mclose" onclick="closeP()">✕</button>${p.name}</div>
    <div class="det"><div class="pcat">${p.cat}</div><h2>${p.name}</h2><div class="price">£${p.price}</div>
      <div class="desc">${p.desc}</div>
      ${p.sizes?`<div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">Size</div>
        <div class="sizes" id="sizes">${p.sizes.map(s=>`<button onclick="pickSize(this,'${s}')">${s}</button>`).join('')}</div>`:''}
      <button class="btn btn-primary btn-lg" style="width:100%" id="addBtn" onclick='addToBag(${JSON.stringify(p).replace(/'/g,"&#39;")})' ${p.sizes?'disabled':''}>Add to bag</button>
    </div></div>`;
  m._size=size;document.getElementById('pOverlay').classList.add('open');
}
function pickSize(btn,s){[...btn.parentElement.children].forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
  document.getElementById('pModal')._size=s;document.getElementById('addBtn').disabled=false;}
function addToBag(p){const size=document.getElementById('pModal')._size||'One size';
  cart.push({name:p.name,price:p.price,size});updateBadge();closeP();openCart();}
function closeP(){document.getElementById('pOverlay').classList.remove('open');}
function updateBadge(){badge.textContent=cart.length;badge.classList.toggle('hidden',cart.length===0);}
function openCart(){document.getElementById('cOverlay').classList.add('open');renderCart();}
function closeCart(){document.getElementById('cOverlay').classList.remove('open');}
function renderCart(){
  const body=document.getElementById('cartBody'),foot=document.getElementById('cartFoot');
  document.getElementById('cartTitle').textContent='Your bag';
  if(!cart.length){body.innerHTML='<div class="empty">Your bag is empty.<br>Find something you love.</div>';foot.innerHTML='';return;}
  body.innerHTML=cart.map((it,i)=>`<div class="line"><div><div style="font-weight:600">${it.name}</div>
    <div style="font-size:13px;color:var(--muted)">${it.size} · £${it.price}</div></div>
    <button class="qty"><button onclick="removeItem(${i})" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:13px">Remove</button></button></div>`).join('');
  const sub=cart.reduce((a,c)=>a+c.price,0);
  foot.innerHTML=`<div class="trow"><span>Subtotal</span><span>£${sub}</span></div>
    <div class="trow"><span>Shipping</span><span>£3.95</span></div>
    <div class="trow total"><span>Total</span><span>£${(sub+3.95).toFixed(2)}</span></div>
    <button class="btn btn-primary" style="width:100%" onclick="checkout()">Checkout</button>`;
}
function removeItem(i){cart.splice(i,1);updateBadge();renderCart();}
function checkout(){
  document.getElementById('cartTitle').textContent='Checkout';
  document.getElementById('cartBody').innerHTML=`
    <div class="field"><label>Name</label><input id="cn" placeholder="Alex Morgan"/></div>
    <div class="field"><label>Email</label><input id="ce" placeholder="you@email.com"/></div>
    <div class="field"><label>Delivery address</label><input id="ca" placeholder="Street, city, postcode"/></div>
    <div class="field"><label>Card number</label><input id="cc" placeholder="4242 4242 4242 4242"/></div>`;
  document.getElementById('cartFoot').innerHTML=`<button class="btn btn-primary" style="width:100%" onclick="placeOrder()">Pay now</button>`;
}
function placeOrder(){
  const nm=(document.getElementById('cn')?.value||'You').split(' ')[0];
  document.getElementById('cartBody').innerHTML=`<div class="success">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h3 style="margin-bottom:6px">Order placed</h3>
    <p style="color:var(--muted)">Thanks ${nm}! ${bizName} is packing your order.</p>
    <p style="font-size:12px;color:var(--muted);margin-top:10px">(Demo — no payment was taken.)</p></div>`;
  document.getElementById('cartTitle').textContent='Confirmed';document.getElementById('cartFoot').innerHTML='';cart=[];updateBadge();
}
renderGrid();
</script>
</body>
</html>
